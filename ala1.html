<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature Verifier | ALA 1</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Colors */
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.1);
            
            --btn-blue: linear-gradient(135deg, #3b82f6, #2563eb);
            --btn-purple: linear-gradient(135deg, #a855f7, #7c3aed);
            --btn-green: linear-gradient(135deg, #10b981, #059669);
            --btn-gray: linear-gradient(135deg, #475569, #334155);

            --success: #10b981;
            --error: #ef4444;

            /* Radii */
            --radius-md: 16px;
            --radius-btn: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Apple Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 30px;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .card-header i {
            color: var(--text-muted);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        /* Inputs & Textareas */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-btn);
            padding: 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: 'Inter', monospace;
            resize: vertical;
            min-height: 100px;
            outline: none;
            transition: border-color 0.3s;
            word-break: break-all;
        }

        textarea:focus {
            border-color: #60a5fa;
        }

        textarea[readonly] {
            opacity: 0.7;
            cursor: default;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-btn);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-blue { background: var(--btn-blue); }
        .btn-purple { background: var(--btn-purple); }
        .btn-green { background: var(--btn-green); }
        .btn-gray { background: var(--btn-gray); }

        .copy-btn {
            position: absolute;
            top: 30px;
            right: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* Result Box */
        .result-box {
            padding: 20px;
            border-radius: var(--radius-btn);
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s;
        }

        .result-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .result-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: slideInRight 0.3s forwards, fadeOut 0.3s forwards 2.7s;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Footer actions */
        .bottom-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
        }

        /* Loader */
        .loader {
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .title { font-size: 2rem; }
            .bottom-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Toast UI -->
    <div id="toast-container"></div>

    <div class="container">
        
        <header>
            <h1 class="title">Digital Signature Verifier</h1>
            <p class="subtitle">Secure Message Authentication via RSA-PSS & SHA-256</p>
        </header>

        <!-- 1. Key Generation -->
        <section class="card">
            <div class="card-header">
                <i data-lucide="key"></i>
                <h2>1. RSA Key Generation</h2>
            </div>
            
            <button id="btn-generate" class="btn btn-blue">
                <i data-lucide="refresh-cw" id="icon-generate"></i> 
                <div class="loader" id="ldr-generate"></div>
                Generate Key Pair
            </button>
            <button id="btn-download" class="btn btn-gray" style="margin-left:10px; display:none;">
                <i data-lucide="download"></i> Download Keys
            </button>

            <div class="grid-2">
                <div class="input-group">
                    <label>Public Key (PEM)</label>
                    <textarea id="pub-key" readonly placeholder="Waiting for key generation..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('pub-key')"><i data-lucide="copy" style="width:16px;height:16px;"></i></button>
                </div>
                <div class="input-group">
                    <label>Private Key (PEM)</label>
                    <textarea id="priv-key" readonly placeholder="Waiting for key generation..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('priv-key')"><i data-lucide="copy" style="width:16px;height:16px;"></i></button>
                </div>
            </div>
        </section>

        <!-- 2. Message & Sign -->
        <section class="card">
            <div class="card-header">
                <i data-lucide="file-text"></i>
                <h2>2. Message Signing</h2>
            </div>
            
            <div class="input-group" style="margin-bottom: 20px;">
                <label>Input Message</label>
                <textarea id="msg-input" placeholder="Type the message you wish to securely sign here..." style="min-height: 80px;"></textarea>
            </div>

            <button id="btn-sign" class="btn btn-purple" disabled>
                <i data-lucide="pen-tool" id="icon-sign"></i> 
                <div class="loader" id="ldr-sign"></div>
                Sign Message
            </button>

            <div class="grid-2">
                <div class="input-group">
                    <label>SHA-256 Hash Digest</label>
                    <textarea id="hash-output" readonly placeholder="Hash of the message will appear here..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('hash-output')"><i data-lucide="copy" style="width:16px;height:16px;"></i></button>
                </div>
                <div class="input-group">
                    <label>Digital Signature (Base64)</label>
                    <textarea id="sig-output" readonly placeholder="Calculated signature will appear here..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('sig-output')"><i data-lucide="copy" style="width:16px;height:16px;"></i></button>
                </div>
            </div>
        </section>

        <!-- 3. Verification -->
        <section class="card">
            <div class="card-header">
                <i data-lucide="shield-check"></i>
                <h2>3. Signature Verification</h2>
            </div>
            
            <button id="btn-verify" class="btn btn-green" disabled>
                <i data-lucide="check-circle" id="icon-verify"></i> 
                <div class="loader" id="ldr-verify"></div>
                Verify Signature
            </button>

            <div id="verify-result" class="result-box" style="display:none;"></div>
        </section>

        <div class="bottom-actions">
            <button id="btn-clear" class="btn btn-gray"><i data-lucide="trash-2"></i> Clear Form</button>
            <a href="home.html" class="btn btn-gray" style="text-decoration:none;"><i data-lucide="arrow-left"></i> Return to Dashboard</a>
        </div>

    </div>

    <script>
        // Init Icons
        lucide.createIcons();

        // Global State Variables for Crypto API
        let cryptoKeyPair = null;
        let signatureBuffer = null;

        // UI Element Selectors
        const elPubKey = document.getElementById('pub-key');
        const elPrivKey = document.getElementById('priv-key');
        const elMsgInput = document.getElementById('msg-input');
        const elHashOutput = document.getElementById('hash-output');
        const elSigOutput = document.getElementById('sig-output');
        const elVerifyResult = document.getElementById('verify-result');

        const btnGen = document.getElementById('btn-generate');
        const btnSign = document.getElementById('btn-sign');
        const btnVerify = document.getElementById('btn-verify');
        const btnDownload = document.getElementById('btn-download');
        const btnClear = document.getElementById('btn-clear');

        // Helper: Convert ArrayBuffer to Base64
        function bufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        // Helper: Format PEM Strings
        function addNewLines(str) {
            let finalString = '';
            while (str.length > 0) {
                finalString += str.substring(0, 64) + '\n';
                str = str.substring(64);
            }
            return finalString;
        }

        function toPem(privateKey, buffer) {
            const b64 = bufferToBase64(buffer);
            const pemHeader = privateKey ? '-----BEGIN PRIVATE KEY-----\n' : '-----BEGIN PUBLIC KEY-----\n';
            const pemFooter = privateKey ? '-----END PRIVATE KEY-----' : '-----END PUBLIC KEY-----';
            return pemHeader + addNewLines(b64) + pemFooter;
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = type === 'error' ? '<i data-lucide="alert-circle" style="color:#ef4444;"></i>' 
                                          : '<i data-lucide="check-circle" style="color:#10b981;"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            toastContainer.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.remove(); }, 3000);
        }

        // Copy Clipboard System
        function copyToClipboard(id) {
            const textarea = document.getElementById(id);
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                showToast('Copied to clipboard!');
            });
        }

        // UI Loading Wrapper
        async function withLoading(btnId, taskCode) {
            const btn = document.getElementById(btnId);
            const icon = document.getElementById(`icon-${btnId.split('-')[1]}`);
            const loader = document.getElementById(`ldr-${btnId.split('-')[1]}`);
            
            btn.disabled = true;
            if(icon) icon.style.display = 'none';
            if(loader) loader.style.display = 'block';

            try {
                await taskCode();
            } catch (err) {
                console.error(err);
                showToast("An error occurred: " + err.message, "error");
            } finally {
                btn.disabled = false;
                if(icon) icon.style.display = 'block';
                if(loader) loader.style.display = 'none';
            }
        }

        // --- CRYPTO OPERATIONS --- //

        // 1. Generate RSA-PSS Keys
        btnGen.addEventListener('click', () => {
            withLoading('btn-generate', async () => {
                const keyPair = await window.crypto.subtle.generateKey(
                    {
                        name: "RSA-PSS",
                        modulusLength: 2048,
                        publicExponent: new Uint8Array([1, 0, 1]),
                        hash: "SHA-256",
                    },
                    true,
                    ["sign", "verify"]
                );

                cryptoKeyPair = keyPair;

                // Export Public Key
                const exportedPubKey = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
                elPubKey.value = toPem(false, exportedPubKey);

                // Export Private Key
                const exportedPrivKey = await window.crypto.subtle.exportKey("pkcs8", keyPair.privateKey);
                elPrivKey.value = toPem(true, exportedPrivKey);

                btnSign.disabled = false;
                btnDownload.style.display = 'inline-flex';
                showToast("RSA Key Pair Generated Successfully!");
            });
        });

        // Download Keys handler
        btnDownload.addEventListener('click', () => {
            const pubBlob = new Blob([elPubKey.value], {type: "text/plain"});
            const privBlob = new Blob([elPrivKey.value], {type: "text/plain"});
            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(pubBlob);
            a.download = "public_key.pem";
            a.click();

            setTimeout(() => {
                a.href = URL.createObjectURL(privBlob);
                a.download = "private_key.pem";
                a.click();
            }, 500);
            
            showToast("Keys Downloaded");
        });

        // 2. Sign Message
        btnSign.addEventListener('click', () => {
            if (!cryptoKeyPair) return showToast("Generate keys first!", "error");
            const message = elMsgInput.value;
            if (!message.trim()) return showToast("Message cannot be empty!", "error");

            withLoading('btn-sign', async () => {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);

                // Calculate Hash exclusively for display
                const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                elHashOutput.value = hashHex;

                // Calculate Signature utilizing RSA-PSS
                signatureBuffer = await window.crypto.subtle.sign(
                    { name: "RSA-PSS", saltLength: 32 },
                    cryptoKeyPair.privateKey,
                    data
                );

                elSigOutput.value = bufferToBase64(signatureBuffer);
                btnVerify.disabled = false;
                
                // Reset verify box if it was open
                elVerifyResult.style.display = 'none';
                elVerifyResult.classList.remove('show');

                showToast("Message signed successfully!");
            });
        });

        // 3. Verify Signature
        btnVerify.addEventListener('click', () => {
            if (!cryptoKeyPair || !signatureBuffer) return showToast("Missing signature or keys", "error");

            withLoading('btn-verify', async () => {
                // Ensure we have current inputs
                const currentMessage = elMsgInput.value;
                const encoder = new TextEncoder();
                const data = encoder.encode(currentMessage);
                
                // Re-importing public key or using existing object
                // We'll use the tracked cryptoKeyPair.publicKey for robust verification 
                const isValid = await window.crypto.subtle.verify(
                    { name: "RSA-PSS", saltLength: 32 },
                    cryptoKeyPair.publicKey,
                    signatureBuffer,
                    data
                );

                elVerifyResult.style.display = 'flex';
                // Trigger reflow
                void elVerifyResult.offsetWidth; 
                elVerifyResult.className = `result-box show ${isValid ? 'result-success' : 'result-error'}`;
                
                if (isValid) {
                    elVerifyResult.innerHTML = '<i data-lucide="check-circle" style="width:32px;height:32px;"></i> <div>Authentic! Signature matches the document.</div>';
                    showToast("Verification Passed");
                } else {
                    elVerifyResult.innerHTML = '<i data-lucide="x-octagon" style="width:32px;height:32px;"></i> <div>Invalid! Signature or Message was tampered with.</div>';
                    showToast("Verification Failed", "error");
                }
                lucide.createIcons();
            });
        });

        // Clear All
        btnClear.addEventListener('click', () => {
            elPubKey.value = '';
            elPrivKey.value = '';
            elMsgInput.value = '';
            elHashOutput.value = '';
            elSigOutput.value = '';
            
            cryptoKeyPair = null;
            signatureBuffer = null;
            
            btnSign.disabled = true;
            btnVerify.disabled = true;
            btnDownload.style.display = 'none';
            
            elVerifyResult.style.display = 'none';
            elVerifyResult.classList.remove('show');
            
            showToast("All fields cleared");
        });

    </script>
</body>
</html>
